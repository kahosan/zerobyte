name: Release Workflow

on:
  push:
    tags:
      - "v*.*.*-kf.*"

permissions:
  contents: read

# Serialize publications so simultaneous builds cannot race to update latest.
concurrency:
  group: release-image
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      image: ${{ steps.version.outputs.image }}
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - name: Determine image version
        id: version
        shell: bash
        run: |
          version_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-kf\.([1-9][0-9]*)$'
          if [[ "$GITHUB_REF_TYPE" != "tag" || ! "$GITHUB_REF_NAME" =~ $version_pattern ]]; then
            echo "::error::Release tags must look like v0.43.2-kf.1 (revision starts at 1)."
            exit 1
          fi
          # GHCR requires a lowercase image name.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # Shown in the UI: strip the fork suffix, v0.43.2-kf.1 -> v0.43.2 (the upstream base version).
          echo "app_version=${GITHUB_REF_NAME%-kf.*}" >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    uses: ./.github/workflows/checks.yml

  e2e-tests:
    needs: prepare
    uses: ./.github/workflows/e2e.yml

  integration-tests:
    needs: prepare
    uses: ./.github/workflows/integration.yml

  build-images:
    needs: [prepare, checks, e2e-tests, integration-tests]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ needs.prepare.outputs.image }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Push images to GitHub Container Registry
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.app_version }}
          cache-from: type=gha,scope=linux-image
          cache-to: type=gha,mode=max,scope=linux-image